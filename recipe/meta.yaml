{% set version = "3.6.0" %}
# This hash does not match the conda-forge hash. It looks like there
# may have been some tags moved around after conda-forge updated their
# recipe but before 10/20/2026.
{% set sha256 = "da1939acb9f82b68b6fc9e1b8d392cc52a5fddae60d09e3e5e20fce40e3d7f83" %}

package:
  name: nvtx-c
  version: {{ version }}

source:
  url: https://github.com/NVIDIA/NVTX/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  ignore_run_exports_from:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja-base
  run:

test:
  files:
    - test_cmake
  requires:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.17
    - ninja-base
  commands:
    - test -e "$PREFIX"/include/nvtx3/nvToolsExt.h  # [not win]
    - test -e "$PREFIX"/include/nvtx3/nvtx3.hpp  # [not win]
    - if not exist "%LIBRARY_INC%"\nvtx3\nvToolsExt.h exit 1  # [win]
    - if not exist "%LIBRARY_INC%"\nvtx3\nvtx3.hpp exit 1  # [win]
    - pushd test_cmake
    - cmake -G "Ninja" .
    - cmake --build . --config Release
    - popd

about:
  home: https://github.com/NVIDIA/NVTX
  summary: NVIDIA Tool Extension Library (NVTX) C API
  description: |
    NVTX is a cross-platform API for annotating source code to provide
    contextual information to developer tools.

  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.txt
  dev_url: https://github.com/NVIDIA/NVTX
  doc_url: https://nvidia.github.io/NVTX/doxygen/index.html

extra:
  recipe-maintainers:
    - conda-forge/cuda
    - shwina
